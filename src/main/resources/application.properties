spring.application.name=app-quejas

# ── Base de Datos (Variables de Entorno para Render) ────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quejas_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:tu_password_local}

# JWT
jwt.secret=${JWT_SECRET:ClaveSecretaDePruebaParaEntornoLocal123456!}

# ── Driver y JPA ───────────────────────────────────────────
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Servidor ───────────────────────────────────────────────
server.port=8080